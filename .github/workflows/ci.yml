name: DocVane CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Dataset Validation
        run: |
          python -c "from src.data.validation import validate_dataset; validate_dataset('data/processed/dataset.csv')"

      - name: Step 2 - Train ML Models & Track with MLflow
        run: |
          python src/models/train.py

      - name: Step 3 - Model Threshold & Evaluation Check
        run: |
          python src/models/evaluate.py

      - name: Step 4 - Run Pytest Suite
        run: |
          pytest -v

      - name: Upload Artifacts and Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docvane-artifacts
          path: |
            artifacts/
            reports/
