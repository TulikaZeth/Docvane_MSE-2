name: DocVane CD Deployment Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Required permissions to publish container images to GitHub Packages (ghcr.io)
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        run: |
          docker build -t docvane:latest .

      - name: Container Smoke Test
        run: |
          docker run -d --name docvane-app -p 8000:8000 docvane:latest
          sleep 5
          curl --fail http://localhost:8000/health || (docker logs docvane-app && exit 1)
          docker stop docvane-app
          docker rm docvane-app

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Image to GitHub Packages
        run: |
          # GHCR strictly requires lowercase repository and image names
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}"

          echo "Publishing to: ${IMAGE_NAME}"

          docker tag docvane:latest ${IMAGE_NAME}:latest
          docker tag docvane:latest ${IMAGE_NAME}:${{ github.sha }}

          docker push ${IMAGE_NAME}:latest
          docker push ${IMAGE_NAME}:${{ github.sha }}
