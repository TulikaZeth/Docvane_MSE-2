name: DocVane CD Deployment Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        run: |
          docker build -t docvane:latest -t docvane:${{ github.sha }} .

      - name: Container Smoke Test
        run: |
          docker run -d --name docvane-app -p 8000:8000 docvane:latest
          sleep 5
          curl --fail http://localhost:8000/health || (docker logs docvane-app && exit 1)
          docker stop docvane-app
          docker rm docvane-app

      - name: Log in to Docker Hub (if secrets configured)
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to Registry (if secrets configured)
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker tag docvane:latest ${{ secrets.DOCKERHUB_USERNAME }}/docvane:latest
          docker tag docvane:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/docvane:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/docvane:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/docvane:${{ github.sha }}
